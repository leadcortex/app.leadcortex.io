schema_version: "1.0"
id: p2-outbound
order: 2
title: Prospection outbound
subtitle: Recherche, enrichissement, séquences, accroches
description: |
  Construire un pipeline outbound qui fonctionne : trouver les bonnes
  cibles, enrichir proprement, écrire des accroches qui déclenchent
  des réponses, concevoir des séquences multicanal et protéger sa
  délivrabilité.
icon: send
color: "#22C55E"
difficulty: 2
language: fr
authors: ["team"]

prerequisites:
  previous_program_ids: [p1-foundations]
  min_level: 2
  min_xp: 100

concepts:
  - id: sourcing
    label: Sourcing de cibles
    description: Trouver les entreprises et les personnes qui matchent son ICP.
  - id: account_research
    label: Recherche de compte
    description: Analyser une cible avant de la contacter.
  - id: enrichment
    label: Enrichissement
    description: Compléter les données (email, téléphone, poste…).
  - id: email_verification
    label: Vérification email
    description: S'assurer que l'adresse existe avant l'envoi.
  - id: segmentation
    label: Segmentation
    description: Découper une liste en sous-groupes cohérents.
  - id: list_quality
    label: Qualité de liste
    description: Peu de bons contacts > beaucoup de contacts flous.
  - id: hooks
    label: Accroches
    description: Les 1ères lignes qui donnent envie de lire la suite.
  - id: personalization
    label: Personnalisation
    description: Adapter chaque message à la cible, à l'échelle.
  - id: sequence_design
    label: Design de séquence
    description: Structurer étapes, délais et canaux d'une séquence.
  - id: cadence
    label: Cadence
    description: Espacer les relances pour maximiser les réponses.
  - id: deliverability
    label: Délivrabilité
    description: Atteindre la boîte de réception, pas les spams.
  - id: warmup
    label: Warmup de domaine
    description: Réchauffer un domaine pour éviter la blacklist.

modules:

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 1 — Rechercher et enrichir
  # ═══════════════════════════════════════════════════════════════════
  - id: p2-m1
    order: 1
    title: Rechercher et enrichir
    description: Constituer une matière première propre.
    prerequisites:
      previous_module_ids: []
      required_concept_ids: []
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 1.1 — Sourcing de cibles
      # ───────────────────────────────────────────────────────────────
      - id: p2-m1-l1-sourcing
        order: 1
        slug: sourcing
        title: Sourcing de cibles
        subtitle: Où trouver les bonnes entreprises
        duration_min: 8
        difficulty: 2
        xp_total: 130
        concepts: [sourcing, account_research]
        skills: [recherche]
        prerequisites:
          previous_lesson_ids: []
          required_concept_ids: [icp_definition]
        unlocks:
          lesson_ids: [p2-m1-l2-enrichment]
        rewards:
          xp: 100
          hearts_refund: 0
        blocks:
          - type: cover
            title: Sourcing de cibles
            subtitle: Outbound · Module 1 · Leçon 1
            mascot_pose: curious
            mascot_line: Un bon sourcing vaut mieux qu'un bon email.
            objectives:
              - Connaître les 4 sources principales de prospects
              - Choisir la source adaptée à son ICP
              - Éviter les listes achetées

          - type: theory
            slides:
              - id: t1
                title: Les 4 sources principales
                body_md: |
                  1. **Bases publiques** — annuaire des entreprises,
                     registres officiels (SIRENE en France, GLEIF pour
                     l'international).
                  2. **LinkedIn** — recherche par poste, secteur, taille,
                     ancienneté.
                  3. **Sources propriétaires** — votre CRM, vos anciens
                     clients, vos recommandations.
                  4. **Signaux publics** — levées de fonds (Crunchbase,
                     Dealroom), recrutements, communiqués.

                callout:
                  tone: warning
                  title: À éviter
                  text: Les listes d'emails achetées détruisent votre domaine et votre crédibilité. Ne le faites jamais.
              - id: t2
                title: Recherche de compte
                body_md: |
                  Avant de contacter une entreprise, on **comprend son
                  contexte** :

                  - Que fait-elle ? À qui vend-elle ?
                  - Quelle est sa taille ? Son stade de croissance ?
                  - Quels sont ses enjeux actuels ?
                  - Qui décide dans son organisation ?

                  Deux minutes de recherche économisent vingt minutes de
                  conversation mal engagée.
              - id: t3
                title: La règle des 3 sources
                body_md: |
                  Pour chaque cible, croisez **au moins 3 sources** :

                  - Le site officiel de l'entreprise.
                  - Un profil LinkedIn décisionnaire.
                  - Un signal externe (levée, presse, recrutement).

                  Quand les 3 concordent, vous avez une cible **solide**.

          - type: practice
            exercises:
              - id: p2-m1-l1-ex1
                kind: mcq
                prompt: Quelle source de prospects est à éviter absolument ?
                explanation_md: |
                  Les listes achetées entraînent du spam, détruisent la
                  délivrabilité de votre domaine et sont illégales dans
                  de nombreuses juridictions.
                xp: 10
                difficulty: 2
                concepts: [sourcing, list_quality]
                payload:
                  options:
                    - Un annuaire officiel d'entreprises
                    - LinkedIn Sales Navigator
                    - Une liste d'emails achetée sur Internet
                    - Un import depuis votre CRM
                  correct: 2

              - id: p2-m1-l1-ex2
                kind: multi_select
                prompt: Que doit-on faire avant de contacter une entreprise ?
                explanation_md: |
                  Comprendre l'activité, la taille, le stade de croissance
                  et identifier qui décide.
                xp: 15
                difficulty: 3
                concepts: [account_research]
                payload:
                  options:
                    - Comprendre son activité principale
                    - Connaître sa taille et son stade
                    - Deviner son chiffre d'affaires exact
                    - Identifier les décisionnaires
                    - Lire tous ses posts LinkedIn
                  correct: [0, 1, 3]

              - id: p2-m1-l1-ex3
                kind: fill_blank
                prompt: "Pour valider une cible, on croise au moins ______ sources."
                explanation_md: |
                  Trois sources concordantes : site officiel, LinkedIn,
                  signal externe.
                xp: 10
                difficulty: 2
                concepts: [sourcing]
                payload:
                  blanks:
                    - correct: ["3", "trois"]

          - type: mission
            mission:
              id: mission-source-targets
              title: Sourcer 5 cibles qualifiées
              brief_md: |
                Dans l'app LeadCortex, ouvrez **Entreprises** et ajoutez
                **5 entreprises** qui matchent votre ICP.

                Pour chacune, renseignez le secteur, la taille et la
                localisation. Ce sont vos cibles de travail pour la suite
                du programme.
              target:
                route: /app/companies/new
                cta: Ajouter une entreprise
              validation:
                trigger: company.created
                conditions:
                  - path: company.count
                    op: ">="
                    value: 5
              on_success:
                xp: 60
                mascot_line: 5 cibles prêtes à être travaillées.
              on_failure:
                feedback_md: Il te faut au moins 5 entreprises créées.
                hint_md: Va dans **Entreprises → Nouvelle** et ajoute 5 profils.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: sourcing
            front: "Citez 3 sources valides de prospects B2B."
            back: "Bases publiques (SIRENE, GLEIF), LinkedIn, sources propriétaires (CRM, recommandations)."
          - concept: account_research
            front: "Que cherche-t-on à savoir avant de contacter une entreprise ?"
            back: "Activité, taille, stade de croissance, enjeux actuels, décisionnaires."

      # ───────────────────────────────────────────────────────────────
      # Leçon 1.2 — Enrichissement
      # ───────────────────────────────────────────────────────────────
      - id: p2-m1-l2-enrichment
        order: 2
        slug: enrichment
        title: Enrichissement des contacts
        subtitle: Compléter ce qui manque
        duration_min: 8
        difficulty: 2
        xp_total: 130
        concepts: [enrichment, account_research]
        skills: [recherche]
        prerequisites:
          previous_lesson_ids: [p2-m1-l1-sourcing]
          required_concept_ids: [sourcing]
        unlocks:
          lesson_ids: [p2-m2-l1-verification]
        rewards:
          xp: 100
          hearts_refund: 0
        blocks:
          - type: cover
            title: Enrichissement des contacts
            subtitle: Outbound · Module 1 · Leçon 2
            mascot_pose: thinking
            mascot_line: Une fiche à moitié vide, c'est une opportunité à moitié perdue.
            objectives:
              - Connaître les 6 champs critiques d'un contact
              - Savoir où trouver chaque information
              - Éviter les données périmées

          - type: theory
            slides:
              - id: t1
                title: Les 6 champs critiques
                body_md: |
                  Pour chaque contact, vous avez besoin de :

                  1. **Nom complet** (prénom + nom).
                  2. **Poste** (rôle actuel, pas historique).
                  3. **Entreprise** (avec domaine web).
                  4. **Email professionnel** (vérifié).
                  5. **Localisation** (fuseau horaire utile).
                  6. **Signal récent** (pour personnaliser).

                  Sans ces 6 champs, votre email sera générique — et
                  ignoré.
                callout:
                  tone: info
                  title: Astuce
                  text: "Un domaine d'entreprise (ex. `acme.com`) ouvre la porte à des patterns d'email fiables : `prenom.nom@`, `p.nom@`, `prenom@`."
              - id: t2
                title: Où trouver chaque champ
                body_md: |
                  | Champ | Source |
                  |---|---|
                  | Nom + poste | LinkedIn, site de l'entreprise |
                  | Domaine | Site officiel, recherche web |
                  | Email | Pattern + vérification (voir leçon 2.1) |
                  | Localisation | LinkedIn, registres officiels |
                  | Signal | Crunchbase, presse, LinkedIn |
                quote:
                  text: L'enrichissement, c'est 20 % d'outil et 80 % de méthode.
                  author: Principe terrain

              - id: t3
                title: Les données périmées
                body_md: |
                  Une donnée périmée **casse plus qu'elle n'aide** :

                  - Un ancien poste → ton message est décalé.
                  - Un email obsolète → rebond dur, mauvaise réputation.
                  - Une entreprise changée → vous parlez au mauvais
                    contexte.

                  **Règle** : toute information non confirmée dans les 6
                  derniers mois est à vérifier avant utilisation.

          - type: practice
            exercises:
              - id: p2-m1-l2-ex1
                kind: multi_select
                prompt: Quels sont les champs critiques d'un contact B2B ?
                explanation_md: |
                  Nom, poste, entreprise, email pro, localisation, signal
                  récent — ces 6 champs sont indispensables.
                xp: 20
                difficulty: 3
                concepts: [enrichment]
                payload:
                  options:
                    - Nom complet
                    - Poste actuel
                    - Nombre d'abonnés LinkedIn
                    - Email professionnel vérifié
                    - Localisation / fuseau horaire
                    - Signal d'achat récent
                  correct: [0, 1, 3, 4, 5]

              - id: p2-m1-l2-ex2
                kind: match_pairs
                prompt: Associez chaque champ à sa source principale.
                explanation_md: |
                  Le bon champ vient toujours de la bonne source.
                xp: 15
                difficulty: 3
                concepts: [enrichment]
                payload:
                  pairs:
                    - left: Poste actuel
                      right: LinkedIn
                    - left: Domaine web
                      right: Site officiel de l'entreprise
                    - left: Signal d'achat
                      right: Crunchbase / presse / LinkedIn
                    - left: Email vérifié
                      right: Pattern + vérification SMTP

              - id: p2-m1-l2-ex3
                kind: mcq
                prompt: |
                  Une information sur un prospect date de 14 mois. Que faire ?
                explanation_md: |
                  Au-delà de 6 mois, on **vérifie avant d'utiliser** —
                  les postes, entreprises et emails changent vite.
                xp: 10
                difficulty: 2
                concepts: [enrichment]
                payload:
                  options:
                    - L'utiliser telle quelle, elle est probablement correcte
                    - La vérifier avant utilisation
                    - La supprimer et passer à un autre prospect
                    - La marquer comme "à risque" sans la vérifier
                  correct: 1

          - type: mission
            mission:
              id: mission-enrich-contacts
              title: Enrichir 5 contacts
              brief_md: |
                Dans l'app LeadCortex, ouvrez **Prospects** et créez ou
                éditez **5 prospects** rattachés à vos entreprises cibles.

                Pour chacun, renseignez au minimum : poste, entreprise,
                email professionnel.
              target:
                route: /app/people
                cta: Voir mes prospects
              validation:
                trigger: lead.updated
                conditions:
                  - path: lead.count_enriched
                    op: ">="
                    value: 5
              on_success:
                xp: 60
                mascot_line: 5 contacts enrichis — la matière première est prête.
              on_failure:
                feedback_md: Il te manque des contacts enrichis (poste + email).
                hint_md: Ouvre **Prospects**, édite 5 fiches, renseigne poste et email.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: enrichment
            front: "Citez les 6 champs critiques d'un contact B2B."
            back: "Nom complet, poste actuel, entreprise, email pro vérifié, localisation, signal récent."

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 2 — Vérifier et segmenter
  # ═══════════════════════════════════════════════════════════════════
  - id: p2-m2
    order: 2
    title: Vérifier et segmenter
    description: S'assurer de la qualité avant l'envoi.
    prerequisites:
      previous_module_ids: [p2-m1]
      required_concept_ids: [enrichment]
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 2.1 — Vérification des emails
      # ───────────────────────────────────────────────────────────────
      - id: p2-m2-l1-verification
        order: 1
        slug: email-verification
        title: Vérification des emails
        subtitle: Protéger son domaine, garantir l'atteinte
        duration_min: 7
        difficulty: 3
        xp_total: 120
        concepts: [email_verification, deliverability]
        skills: [technique]
        prerequisites:
          previous_lesson_ids: [p2-m1-l2-enrichment]
          required_concept_ids: [enrichment]
        unlocks:
          lesson_ids: [p2-m2-l2-segmentation]
        rewards:
          xp: 90
          hearts_refund: 0
        blocks:
          - type: cover
            title: Vérification des emails
            subtitle: Outbound · Module 2 · Leçon 1
            mascot_pose: thinking
            mascot_line: Un email non vérifié est une bombe à retardement.
            objectives:
              - Comprendre les 4 états d'un email
              - Savoir quand et comment vérifier
              - Protéger la réputation du domaine

          - type: theory
            slides:
              - id: t1
                title: Les 4 états d'un email
                body_md: |
                  1. **Valide** — la boîte existe et accepte le message.
                  2. **Invalide** — la boîte n'existe pas (rebond dur).
                  3. **Risqué** — boîte piège (spam trap) ou catch-all.
                  4. **Inconnu** — le serveur n'a pas répondu.

                  On **envoie uniquement** sur les **valides**. Les
                  risqués sont mis de côté pour traitement manuel.
                callout:
                  tone: warning
                  title: Danger
                  text: Un taux de rebond > 3 % détruit votre réputation d'expéditeur. Vérifiez **tout** avant l'envoi.
              - id: t2
                title: Comment vérifier un email
                body_md: |
                  Deux méthodes :

                  - **Vérification syntaxique** — le format est-il
                    valide ? (`nom@domaine.tld`)
                  - **Vérification SMTP** — la boîte existe-t-elle
                    réellement ? On teste via `RCPT TO`.

                  Les outils modernes combinent les deux. Ne jamais
                  envoyer sur un email non vérifié.
              - id: t3
                title: Le catch-all et les pièges
                body_md: |
                  Un **catch-all** accepte toutes les adresses (le serveur
                  dit « oui » à tout). Impossible de savoir si la boîte
                  est réelle.

                  Un **spam trap** est une adresse piège laissée par les
                  filtres anti-spam. Y envoyer **une seule fois** peut
                  blacklister votre domaine.

                  Règle : sur ces deux cas, on **n'envoie pas**.

          - type: practice
            exercises:
              - id: p2-m2-l1-ex1
                kind: multi_select
                prompt: Sur quels états d'email peut-on envoyer en sécurité ?
                explanation_md: |
                  Uniquement sur les emails **valides**. Tout le reste
                  (invalide, risqué, inconnu) doit être écarté.
                xp: 15
                difficulty: 3
                concepts: [email_verification]
                payload:
                  options:
                    - Valide
                    - Invalide
                    - Risqué (spam trap)
                    - Inconnu (catch-all)
                  correct: [0]

              - id: p2-m2-l1-ex2
                kind: mcq
                prompt: Quel est le taux de rebond maximal acceptable ?
                explanation_md: |
                  Au-delà de **3 %**, votre réputation d'expéditeur
                  chute et vos emails finissent en spam.
                xp: 15
                difficulty: 3
                concepts: [email_verification, deliverability]
                payload:
                  options:
                    - 1 %
                    - 3 %
                    - 10 %
                    - 25 %
                  correct: 1

              - id: p2-m2-l1-ex3
                kind: fill_blank
                prompt: "Un domaine ______ accepte toutes les adresses, ce qui rend la vérification impossible."
                explanation_md: |
                  Un domaine **catch-all** répond « oui » à toutes les
                  vérifications — impossible de savoir si la boîte existe.
                xp: 10
                difficulty: 3
                concepts: [email_verification]
                payload:
                  blanks:
                    - correct: ["catch-all", "catch all", "catchall"]

          - type: mission
            mission:
              id: mission-verify-emails
              title: Vérifier 3 emails avant envoi
              brief_md: |
                Dans l'app LeadCortex, ouvrez **Prospects** et lancez
                une vérification d'emails sur **3 contacts**.

                Le statut de chaque email doit passer à *valide* ou être
                identifié comme *risqué/invalide*.
              target:
                route: /app/enrichment
                cta: Lancer une vérification
              validation:
                trigger: lead.verified
                conditions:
                  - path: lead.count_verified
                    op: ">="
                    value: 3
              on_success:
                xp: 50
                mascot_line: 3 emails vérifiés — zéro rebond en vue.
              on_failure:
                feedback_md: Il te manque 3 contacts avec email vérifié.
                hint_md: Va dans **Enrichissement** et lance la vérification.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: email_verification
            front: "Sur quels emails peut-on envoyer en toute sécurité ?"
            back: "Uniquement les valides. Les invalides, risqués (spam trap) et inconnus (catch-all) sont écartés."
          - concept: deliverability
            front: "Quel est le taux de rebond maximal acceptable ?"
            back: "3 %. Au-delà, la réputation d'expéditeur chute rapidement."

      # ───────────────────────────────────────────────────────────────
      # Leçon 2.2 — Segmentation
      # ───────────────────────────────────────────────────────────────
      - id: p2-m2-l2-segmentation
        order: 2
        slug: segmentation
        title: Segmentation
        subtitle: Découper une liste pour mieux parler
        duration_min: 7
        difficulty: 2
        xp_total: 120
        concepts: [segmentation, list_quality]
        skills: [stratégie]
        prerequisites:
          previous_lesson_ids: [p2-m2-l1-verification]
          required_concept_ids: [email_verification]
        unlocks:
          lesson_ids: [p2-m3-l1-hooks]
        rewards:
          xp: 90
          hearts_refund: 0
        blocks:
          - type: cover
            title: Segmentation
            subtitle: Outbound · Module 2 · Leçon 2
            mascot_pose: thinking
            mascot_line: Un message par segment vaut mieux que dix messages génériques.
            objectives:
              - Comprendre pourquoi segmenter
              - Connaître 3 critères de segmentation
              - Améliorer la pertinence

          - type: theory
            slides:
              - id: t1
                title: Pourquoi segmenter ?
                body_md: |
                  Un même ICP contient **plusieurs réalités** :

                  - Un CTO d'une startup de 20 personnes n'a pas les
                    mêmes enjeux qu'un CTO d'une ETI de 500.
                  - Un industriel et un SaaS B2B n'ont pas les mêmes
                    signaux.
                  - Un décideur français et un décideur allemand n'ont
                    pas les mêmes attentes.

                  Segmenter = **parler la bonne langue à la bonne
                  cible**.
                callout:
                  tone: info
                  title: Règle
                  text: Un segment = un message. Deux segments = deux messages. Plus vous segmentez, plus votre taux de réponse augmente.
              - id: t2
                title: Les 3 critères de segmentation
                body_md: |
                  1. **Par secteur** — SaaS, industrie, retail, santé…
                     Chaque secteur a son vocabulaire.
                  2. **Par taille** — TPE, PME, ETI, grands comptes. La
                     taille change les enjeux.
                  3. **Par persona** — champion, décideur, utilisateur,
                     bloqueur. Le rôle change l'angle d'attaque.

                  Ces critères sont **cumulables**. Un segment peut être
                  « SaaS · PME · CTO ».
              - id: t3
                title: Le mythe de la personnalisation à outrance
                body_md: |
                  Personnaliser **chaque email** ne scale pas — sauf si
                  vous vendez 5 contrats par an.

                  La stratégie qui marche : **personnaliser au niveau du
                  segment**, avec 1 ou 2 variables au niveau du contact
                  (prénom, entreprise, signal).

                  C'est le meilleur compromis effort / impact.

          - type: practice
            exercises:
              - id: p2-m2-l2-ex1
                kind: multi_select
                prompt: Quels sont les bons critères de segmentation B2B ?
                explanation_md: |
                  Secteur, taille, persona — ces trois critères changent
                  significativement le message à envoyer.
                xp: 15
                difficulty: 3
                concepts: [segmentation]
                payload:
                  options:
                    - Secteur d'activité
                    - Taille de l'entreprise
                    - Couleur du logo
                    - Persona (rôle du contact)
                    - Nombre de lettres du prénom
                  correct: [0, 1, 3]

              - id: p2-m2-l2-ex2
                kind: mcq
                prompt: Combien de segments devrait-on viser pour un premier pipeline ?
                explanation_md: |
                  **2 à 3 segments** suffisent pour démarrer. Trop de
                  segments dès le début dilue l'effort et complique
                  l'analyse.
                xp: 10
                difficulty: 2
                concepts: [segmentation]
                payload:
                  options:
                    - Un seul segment
                    - 2 à 3 segments
                    - 10 segments, pour couvrir tous les cas
                    - Autant que possible, pour éviter la monotonie
                  correct: 1

              - id: p2-m2-l2-ex3
                kind: order_steps
                prompt: |
                  Remettez dans l'ordre les étapes d'une stratégie de
                  personnalisation réaliste.
                explanation_md: |
                  On définit le segment, on crée un message cible, puis
                  on ajoute 1-2 variables individuelles.
                xp: 15
                difficulty: 3
                concepts: [personalization, segmentation]
                payload:
                  steps:
                    - Définir les segments par secteur + taille + persona
                    - Rédiger un message par segment
                    - Ajouter 1-2 variables au niveau du contact
                    - Mesurer le taux de réponse par segment
                    - Ajuster les messages selon les résultats

          - type: mission
            mission:
              id: mission-segment-list
              title: Créer 2 segments dans une liste
              brief_md: |
                Dans l'app LeadCortex, ouvrez **Listes** et créez
                **2 listes** qui correspondent à deux segments distincts
                (par secteur, taille, ou persona).
              target:
                route: /app/lists
                cta: Voir mes listes
              validation:
                trigger: list.created
                conditions:
                  - path: list.count
                    op: ">="
                    value: 2
              on_success:
                xp: 50
                mascot_line: 2 segments — la personnalisation devient possible.
              on_failure:
                feedback_md: Il te faut au moins 2 listes créées.
                hint_md: Va dans **Listes → Nouvelle** et crée 2 listes distinctes.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: segmentation
            front: "Citez 3 critères de segmentation B2B."
            back: "Secteur, taille d'entreprise, persona (champion / décideur / utilisateur / bloqueur)."

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 3 — Rédiger et personnaliser
  # ═══════════════════════════════════════════════════════════════════
  - id: p2-m3
    order: 3
    title: Rédiger et personnaliser
    description: Écrire des messages qui déclenchent des réponses.
    prerequisites:
      previous_module_ids: [p2-m2]
      required_concept_ids: [segmentation]
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 3.1 — Accroches
      # ───────────────────────────────────────────────────────────────
      - id: p2-m3-l1-hooks
        order: 1
        slug: hooks
        title: Accroches
        subtitle: La première ligne qui décide de tout
        duration_min: 8
        difficulty: 3
        xp_total: 140
        concepts: [hooks, personalization]
        skills: [communication]
        prerequisites:
          previous_lesson_ids: [p2-m2-l2-segmentation]
          required_concept_ids: [segmentation, tone_b2b]
        unlocks:
          lesson_ids: [p2-m3-l2-personalization]
        rewards:
          xp: 100
          hearts_refund: 0
        blocks:
          - type: cover
            title: Accroches
            subtitle: Outbound · Module 3 · Leçon 1
            mascot_pose: happy
            mascot_line: Si la première ligne n'accroche pas, la deuxième n'existe pas.
            objectives:
              - Comprendre le rôle d'une accroche
              - Connaître 4 types d'accroches efficaces
              - Éviter les accroches génériques

          - type: theory
            slides:
              - id: t1
                title: L'accroche, c'est 80 % du message
                body_md: |
                  Un prospect lit votre objet, puis **la première
                  ligne**.

                  Si la première ligne ne parle pas de **lui**, il
                  ferme. Peu importe la qualité du reste.

                  Une bonne accroche répond à : *« Pourquoi ce message
                  est-il pour moi, précisément ? »*
                callout:
                  tone: success
                  title: Test simple
                  text: Remplacez le prénom du prospect par un autre. Si le message reste vrai, l'accroche n'est pas personnalisée.
              - id: t2
                title: 4 types d'accroches qui marchent
                body_md: |
                  1. **Le signal récent** — « J'ai vu votre levée de
                     fonds de 12 M€ hier. »
                  2. **Le contexte métier** — « Vous ouvrez un bureau
                     à Madrid le mois prochain. »
                  3. **Le problème spécifique** — « Vos SDR passent en
                     moyenne 40 % de leur temps à chercher des emails. »
                  4. **La preuve sociale sectorielle** — « On a aidé
                     [Concurrent X] à doubler ses RDV en 3 mois. »

                  Chaque type fonctionne. Le meilleur dépend de votre
                  segment.
              - id: t3
                title: Les accroches génériques à bannir
                body_md: |
                  - « J'espère que vous allez bien. »
                  - « Je me permets de vous contacter. »
                  - « Nous sommes leader sur le marché. »
                  - « Je vous propose 15 min pour échanger. »

                  Ces phrases sont **vues 100 fois par jour** par votre
                  prospect. Elles déclenchent le rejet immédiat.

          - type: practice
            exercises:
              - id: p2-m3-l1-ex1
                kind: multi_select
                prompt: Quels sont les bons types d'accroches B2B ?
                explanation_md: |
                  Signal récent, contexte métier, problème spécifique,
                  preuve sociale sectorielle — ces 4 approches
                  fonctionnent.
                xp: 20
                difficulty: 3
                concepts: [hooks]
                payload:
                  options:
                    - Signal récent (levée, recrutement…)
                    - Contexte métier de l'entreprise
                    - Formule de politesse longue
                    - Problème spécifique du secteur
                    - Preuve sociale sectorielle
                  correct: [0, 1, 3, 4]

              - id: p2-m3-l1-ex2
                kind: mcq
                prompt: Quelle phrase est à bannir dans un premier email ?
                explanation_md: |
                  « J'espère que vous allez bien » est vu 100 fois par
                  jour — c'est le signal #1 d'un email générique.
                xp: 10
                difficulty: 2
                concepts: [hooks, tone_b2b]
                payload:
                  options:
                    - "J'ai vu votre levée de fonds de 12 M€."
                    - "J'espère que vous allez bien."
                    - "Vous ouvrez un bureau à Madrid en juin."
                    - "Vos SDR passent 40 % de leur temps à chercher des emails."
                  correct: 1

              - id: p2-m3-l1-ex3
                kind: free_text
                prompt: |
                  Rédigez une accroche de 1 à 2 phrases pour un CTO de
                  SaaS B2B qui vient de lever 15 M€ pour accélérer son
                  go-to-market.
                explanation_md: |
                  Une bonne accroche mentionne le signal (levée), le
                  contexte (accélération GTM) et le problème adressé.
                xp: 30
                difficulty: 4
                concepts: [hooks, personalization]
                payload:
                  min_words: 15
                  max_words: 80
                  rubric_md: |
                    La réponse doit :
                    - mentionner le signal (levée de fonds) ;
                    - contextualiser (accélération, go-to-market) ;
                    - s'adresser au CTO en tant que responsable technique.
                  expected_keywords:
                    - levée
                    - SaaS
                    - CTO
                    - go-to-market
                    - accélération
                    - scaling

          - type: mission
            mission:
              id: mission-write-hook
              title: Écrire une accroche personnalisée
              brief_md: |
                Dans l'app LeadCortex, ouvrez la fiche d'un de vos
                prospects et rédigez dans la section **Notes** une
                accroche personnalisée en 2 lignes.

                Utilisez un signal récent identifié dans le champ
                Signal du prospect.
              target:
                route: /app/people
                cta: Voir mes prospects
              validation:
                trigger: lead.updated
                conditions:
                  - path: lead.notes_length
                    op: ">="
                    value: 100
              on_success:
                xp: 60
                mascot_line: Une accroche prête à être intégrée dans ta séquence.
              on_failure:
                feedback_md: Les notes du prospect sont trop courtes (< 100 caractères).
                hint_md: Ouvre une fiche prospect, section Notes, écris 2 lignes d'accroche.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: hooks
            front: "Citez 3 types d'accroches qui fonctionnent en B2B."
            back: "Signal récent, contexte métier, problème spécifique du secteur, preuve sociale sectorielle."

      # ───────────────────────────────────────────────────────────────
      # Leçon 3.2 — Personnalisation à l'échelle
      # ───────────────────────────────────────────────────────────────
      - id: p2-m3-l2-personalization
        order: 2
        slug: personalization
        title: Personnalisation à l'échelle
        subtitle: Variables et templates
        duration_min: 7
        difficulty: 3
        xp_total: 130
        concepts: [personalization, sequence_design]
        skills: [communication, technique]
        prerequisites:
          previous_lesson_ids: [p2-m3-l1-hooks]
          required_concept_ids: [hooks]
        unlocks:
          lesson_ids: [p2-m4-l1-sequence-design]
        rewards:
          xp: 100
          hearts_refund: 0
        blocks:
          - type: cover
            title: Personnalisation à l'échelle
            subtitle: Outbound · Module 3 · Leçon 2
            mascot_pose: thinking
            mascot_line: Personnaliser ne veut pas dire écrire à la main.
            objectives:
              - Distinguer personnalisation de segment et de contact
              - Utiliser des variables sûres
              - Éviter les fallbacks dangereux

          - type: theory
            slides:
              - id: t1
                title: Deux niveaux de personnalisation
                body_md: |
                  - **Niveau segment** — le message est différent par
                    segment (SaaS / Industrie, PME / ETI). Écrit une
                    fois, utilisé pour tout le segment.
                  - **Niveau contact** — 1 à 3 variables remplacées
                    dynamiquement : prénom, entreprise, signal.

                  La combinaison **segment + 2 variables** donne 90 %
                  du résultat pour 10 % de l'effort.
                callout:
                  tone: info
                  title: Règle empirique
                  text: Une bonne séquence a 3 à 5 variables maximum. Au-delà, la maintenance devient ingérable.
              - id: t2
                title: Les variables sûres
                body_md: |
                  Variables fiables (à utiliser sans crainte) :

                  - `{{first_name}}` — le prénom.
                  - `{{company_name}}` — le nom de l'entreprise.
                  - `{{role}}` — le poste.
                  - `{{industry}}` — le secteur.

                  Variables **risquées** (à vérifier) :

                  - `{{recent_news}}` — doit exister, sinon message
                    cassé.
                  - `{{revenue}}` — souvent faux ou périmé.
                  - `{{interests}}` — rares et subjectifs.
              - id: t3
                title: Les fallbacks dangereux
                body_md: |
                  Un fallback est ce qui remplace une variable manquante.

                  - **Bon fallback** : `{{first_name | "Bonjour"}}` — lu
                    naturellement dans tous les cas.
                  - **Mauvais fallback** : `{{first_name | ""}}` — crée
                    des « , » en début de phrase.

                  Toujours définir un fallback **qui se lit bien**.

          - type: practice
            exercises:
              - id: p2-m3-l2-ex1
                kind: multi_select
                prompt: Quelles variables sont sûres à utiliser ?
                explanation_md: |
                  Prénom, entreprise, poste et secteur sont fiables.
                  Les variables comme "recent_news" nécessitent une
                  vérification préalable.
                xp: 15
                difficulty: 3
                concepts: [personalization]
                payload:
                  options:
                    - Prénom
                    - Nom de l'entreprise
                    - Actualité récente
                    - Poste
                    - Secteur
                  correct: [0, 1, 3, 4]

              - id: p2-m3-l2-ex2
                kind: mcq
                prompt: Quel fallback est correct pour le prénom ?
                explanation_md: |
                  `{{first_name | "Bonjour"}}` se lit naturellement que
                  le prénom soit présent ou non. Un fallback vide crée
                  des phrases cassées.
                xp: 10
                difficulty: 3
                concepts: [personalization]
                payload:
                  options:
                    - '{{first_name | ""}}'
                    - '{{first_name | "Bonjour"}}'
                    - '{{first_name | null}}'
                    - Aucun fallback, on suppose que le prénom existe
                  correct: 1

              - id: p2-m3-l2-ex3
                kind: fill_blank
                prompt: "Une séquence doit contenir au maximum ______ variables pour rester maintenable."
                explanation_md: |
                  Au-delà de 5 variables, la maintenance devient
                  ingérable. 3 à 5 est l'optimum.
                xp: 15
                difficulty: 3
                concepts: [personalization]
                payload:
                  blanks:
                    - correct: ["5", "cinq"]

          - type: mission
            mission:
              id: mission-template-variables
              title: Utiliser 2 variables dans une séquence
              brief_md: |
                Dans l'app LeadCortex, ouvrez une de vos séquences et
                éditez une étape.

                Insérez **au moins 2 variables** dans le corps de
                l'email (`{{first_name}}`, `{{company_name}}`…).
              target:
                route: /app/sequences
                cta: Voir mes séquences
              validation:
                trigger: sequence.updated
                conditions:
                  - path: sequence.variables_count
                    op: ">="
                    value: 2
              on_success:
                xp: 60
                mascot_line: Deux variables — tu personnalises proprement.
              on_failure:
                feedback_md: Aucune ou une seule variable trouvée dans la séquence.
                hint_md: Édite une étape et ajoute `{{first_name}}` + `{{company_name}}`.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: personalization
            front: "Quels sont les 2 niveaux de personnalisation en outbound ?"
            back: "Niveau segment (message par segment) et niveau contact (1-3 variables : prénom, entreprise, signal)."

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 4 — Séquencer et délivrer
  # ═══════════════════════════════════════════════════════════════════
  - id: p2-m4
    order: 4
    title: Séquencer et délivrer
    description: Concevoir des séquences multicanal et protéger son domaine.
    prerequisites:
      previous_module_ids: [p2-m3]
      required_concept_ids: [personalization, sequence_design]
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 4.1 — Design de séquence
      # ───────────────────────────────────────────────────────────────
      - id: p2-m4-l1-sequence-design
        order: 1
        slug: sequence-design
        title: Design de séquence
        subtitle: Étapes, canaux, cadence
        duration_min: 8
        difficulty: 3
        xp_total: 140
        concepts: [sequence_design, cadence, channels]
        skills: [stratégie]
        prerequisites:
          previous_lesson_ids: [p2-m3-l2-personalization]
          required_concept_ids: [personalization]
        unlocks:
          lesson_ids: [p2-m4-l2-deliverability]
        rewards:
          xp: 100
          hearts_refund: 0
        blocks:
          - type: cover
            title: Design de séquence
            subtitle: Outbound · Module 4 · Leçon 1
            mascot_pose: happy
            mascot_line: Une bonne séquence, c'est un rythme — pas une avalanche.
            objectives:
              - Structurer une séquence multicanal
              - Choisir sa cadence
              - Décider quand s'arrêter

          - type: theory
            slides:
              - id: t1
                title: Structure d'une séquence efficace
                body_md: |
                  Une séquence B2B standard comporte **5 à 7 étapes**
                  réparties sur **14 à 21 jours** :

                  1. **J0** — Email de découverte (accroche + CTA faible).
                  2. **J2** — LinkedIn (demande de connexion).
                  3. **J5** — Email de relance (nouvel angle).
                  4. **J9** — Appel téléphonique (si possible).
                  5. **J12** — LinkedIn (message court).
                  6. **J15** — Email de clôture (permission de partir).
                  7. **J21** — Optionnel : dernier contact.

                  Chaque étape **apporte un angle nouveau** — pas une
                  répétition.
                callout:
                  tone: info
                  title: Principe
                  text: Toute séquence doit pouvoir « sortir par la porte ». Si le prospect dit non 3 fois, il faut le respecter.
              - id: t2
                title: La cadence
                body_md: |
                  Espacement recommandé entre deux emails : **3 à 5
                  jours**.

                  Trop serré → spam, agacement, désinscription.
                  Trop espacé → le prospect oublie qui vous êtes.

                  La **règle empirique** : ne jamais envoyer deux emails
                  le même jour, ne jamais laisser plus d'une semaine
                  entre deux touches.
              - id: t3
                title: Quand s'arrêter
                body_md: |
                  On arrête la séquence si :

                  - Le prospect a répondu (positif ou négatif).
                  - Le prospect s'est désabonné.
                  - L'entreprise a fermé ou changé de cible.
                  - L'étape finale a été atteinte sans réponse.

                  Dans le dernier cas, on met le prospect en **pause
                  longue** (90 jours minimum) avant de retenter.

          - type: practice
            exercises:
              - id: p2-m4-l1-ex1
                kind: mcq
                prompt: Combien d'étapes typiques dans une séquence B2B ?
                explanation_md: |
                  5 à 7 étapes sur 14-21 jours est l'optimum. En dessous
                  on ne teste pas assez, au-dessus on agace.
                xp: 10
                difficulty: 2
                concepts: [sequence_design]
                payload:
                  options:
                    - 1 à 2 étapes
                    - 5 à 7 étapes
                    - 15 à 20 étapes
                    - Autant que possible
                  correct: 1

              - id: p2-m4-l1-ex2
                kind: order_steps
                prompt: Remettez la séquence standard dans le bon ordre.
                explanation_md: |
                  On commence par un email de découverte, on relance par
                  LinkedIn, puis par email, téléphone, LinkedIn à
                  nouveau, et on termine par un email de clôture.
                xp: 20
                difficulty: 4
                concepts: [sequence_design]
                payload:
                  steps:
                    - J0 — Email de découverte
                    - J2 — LinkedIn (demande de connexion)
                    - J5 — Email de relance (nouvel angle)
                    - J9 — Appel téléphonique
                    - J12 — LinkedIn (message court)
                    - J15 — Email de clôture (permission de partir)

              - id: p2-m4-l1-ex3
                kind: fill_blank
                prompt: "L'espacement recommandé entre deux emails est de ______ à ______ jours."
                explanation_md: |
                  3 à 5 jours entre deux emails est l'optimum — ni trop
                  serré, ni trop espacé.
                xp: 15
                difficulty: 3
                concepts: [cadence]
                payload:
                  blanks:
                    - correct: ["3", "trois"]
                    - correct: ["5", "cinq"]

          - type: mission
            mission:
              id: mission-build-sequence
              title: Construire une séquence 5 étapes
              brief_md: |
                Dans l'app LeadCortex, ouvrez **Séquences** et éditez
                une séquence pour qu'elle contienne **5 étapes** avec au
                moins **2 canaux différents** (email + LinkedIn par
                exemple).
              target:
                route: /app/sequences
                cta: Voir mes séquences
              validation:
                trigger: sequence.updated
                conditions:
                  - path: sequence.steps_count
                    op: ">="
                    value: 5
              on_success:
                xp: 70
                mascot_line: 5 étapes — la séquence est prête à tourner.
              on_failure:
                feedback_md: La séquence doit contenir au moins 5 étapes.
                hint_md: Édite ta séquence et ajoute des étapes jusqu'à 5.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: sequence_design
            front: "Combien d'étapes dans une séquence B2B efficace ?"
            back: "5 à 7 étapes sur 14 à 21 jours, avec 2-3 canaux différents."
          - concept: cadence
            front: "Quel est l'espacement recommandé entre deux emails ?"
            back: "3 à 5 jours. Jamais deux emails le même jour, jamais plus d'une semaine entre deux touches."

      # ───────────────────────────────────────────────────────────────
      # Leçon 4.2 — Délivrabilité et warmup
      # ───────────────────────────────────────────────────────────────
      - id: p2-m4-l2-deliverability
        order: 2
        slug: deliverability
        title: Délivrabilité et warmup
        subtitle: Atteindre la boîte, pas les spams
        duration_min: 8
        difficulty: 4
        xp_total: 150
        concepts: [deliverability, warmup]
        skills: [technique]
        prerequisites:
          previous_lesson_ids: [p2-m4-l1-sequence-design]
          required_concept_ids: [sequence_design]
        unlocks:
          lesson_ids: []
        rewards:
          xp: 120
          hearts_refund: 0
        blocks:
          - type: cover
            title: Délivrabilité et warmup
            subtitle: Outbound · Module 4 · Leçon 2
            mascot_pose: thinking
            mascot_line: Le meilleur email au monde ne sert à rien s'il finit en spam.
            objectives:
              - Connaître les 3 protocoles d'authentification
              - Comprendre le warmup
              - Éviter la blacklist

          - type: theory
            slides:
              - id: t1
                title: Les 3 protocoles d'authentification
                body_md: |
                  - **SPF** — indique quels serveurs sont autorisés à
                    envoyer pour votre domaine.
                  - **DKIM** — signe cryptographiquement vos emails.
                  - **DMARC** — politique globale + adresse de rapport.

                  Les trois sont **obligatoires** depuis 2024 (Gmail,
                  Outlook). Sans eux, vos emails sont rejetés ou mis en
                  spam d'office.
                callout:
                  tone: warning
                  title: Non négociable
                  text: Un domaine sans SPF + DKIM + DMARC ne peut pas faire d'outbound fiable. Point.
              - id: t2
                title: Le warmup
                body_md: |
                  Un **domaine neuf** n'a aucune réputation. Envoyer 500
                  emails le jour 1 = blacklist immédiate.

                  Le **warmup** consiste à envoyer progressivement :

                  - **J1-J3** : 5-10 emails/jour.
                  - **J4-J7** : 15-25 emails/jour.
                  - **J8-J14** : 30-50 emails/jour.
                  - **J15+** : 100+/jour (plateau).

                  L'objectif : habituer les FAI à votre domaine avant la
                  montée en charge.
              - id: t3
                title: Éviter la blacklist
                body_md: |
                  Signaux d'alerte :

                  - Taux de rebond > 3 %.
                  - Taux de plainte > 0,1 %.
                  - Volume envoyé > 100/jour sans warmup.
                  - Domaines blacklistés (à vérifier sur MXToolbox).

                  En cas de blacklist, il faut **arrêter toute
                  campagne**, purger la liste et reprendre le warmup à
                  zéro.

          - type: practice
            exercises:
              - id: p2-m4-l2-ex1
                kind: multi_select
                prompt: Quels protocoles sont obligatoires pour l'outbound moderne ?
                explanation_md: |
                  SPF, DKIM et DMARC sont obligatoires depuis 2024
                  (Gmail + Outlook). Sans eux, pas d'outbound fiable.
                xp: 20
                difficulty: 4
                concepts: [deliverability]
                payload:
                  options:
                    - SPF
                    - SMTP direct
                    - DKIM
                    - DMARC
                    - IMAP
                  correct: [0, 2, 3]

              - id: p2-m4-l2-ex2
                kind: order_steps
                prompt: Remettez les phases d'un warmup dans le bon ordre.
                explanation_md: |
                  On commence à 5-10 emails/jour, on monte progressive-
                  ment, jusqu'à 100+/jour après 15 jours.
                xp: 20
                difficulty: 4
                concepts: [warmup]
                payload:
                  steps:
                    - J1-J3 · 5 à 10 emails/jour
                    - J4-J7 · 15 à 25 emails/jour
                    - J8-J14 · 30 à 50 emails/jour
                    - J15+ · 100+ emails/jour

              - id: p2-m4-l2-ex3
                kind: mcq
                prompt: |
                  Votre taux de rebond atteint 6 % sur une séquence.
                  Que faites-vous ?
                explanation_md: |
                  6 % > 3 % → il faut **arrêter immédiatement** la
                  campagne, purger la liste et reprendre le warmup.
                xp: 15
                difficulty: 4
                concepts: [deliverability]
                payload:
                  options:
                    - On continue, ça va se stabiliser
                    - On arrête, on purge la liste, on reprend le warmup
                    - On augmente le volume pour compenser
                    - On change juste l'objet de l'email
                  correct: 1

          - type: mission
            mission:
              id: mission-check-domain
              title: Vérifier la configuration de son domaine
              brief_md: |
                Dans l'app LeadCortex, ouvrez **Paramètres → Capacités**
                et vérifie que tes **domaines d'envoi** sont bien
                configurés (SPF, DKIM, DMARC).

                Si aucun domaine n'est configuré, ajoute-en un — il sera
                marqué comme "en cours de vérification".
              target:
                route: /app/settings
                cta: Ouvrir les paramètres
              validation:
                trigger: domain.configured
                conditions:
                  - path: domain.count
                    op: ">="
                    value: 1
              on_success:
                xp: 80
                mascot_line: Domaine configuré — tu es prêt pour l'envoi sérieux.
              on_failure:
                feedback_md: Aucun domaine d'envoi configuré.
                hint_md: Va dans **Paramètres → Capacités → Domaines d'envoi**.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
