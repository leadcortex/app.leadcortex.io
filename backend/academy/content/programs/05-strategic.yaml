schema_version: "1.0"
id: p5-strategic
order: 5
title: Comptes stratégiques
subtitle: Grands comptes, cycles longs, multi-threading
description: |
  Vendre aux grands comptes : comprendre leurs spécificités, piloter
  des cycles longs, cartographier les décideurs, gérer les bloqueurs,
  construire un plan de compte et animer des QBR qui transforment un
  client en partenaire.
icon: building-2
color: "#8B5CF6"
difficulty: 5
language: fr
authors: ["team"]

prerequisites:
  previous_program_ids: [p4-closing]
  min_level: 5
  min_xp: 1500

concepts:
  - id: enterprise_specifics
    label: Spécificités des grands comptes
    description: Ce qui distingue un grand compte d'une PME dans la vente.
  - id: formal_procurement
    label: Process d'achat formel
    description: Appels d'offres, comités, achats, juridique.
  - id: long_cycle
    label: Cycle de vente long
    description: Séquencer un deal sur 6, 9 ou 18 mois sans perdre le momentum.
  - id: buying_committee
    label: Comité d'achat
    description: Cartographier tous les acteurs et leurs enjeux.
  - id: multi_threading
    label: Multi-threading
    description: Tisser plusieurs relations simultanées dans un même compte.
  - id: champion_enterprise
    label: Champion en grand compte
    description: Le champion en environnement complexe — rôle et fragilités.
  - id: blockers
    label: Bloqueurs
    description: Identifier et neutraliser les opposants au projet.
  - id: account_plan
    label: Plan de compte
    description: Document vivant qui structure la stratégie sur un compte.
  - id: exec_sponsor
    label: Exec sponsor
    description: Sponsor exécutif interne qui porte le deal en haut.
  - id: qbr
    label: QBR
    description: Quarterly Business Review — bilan stratégique avec le client.

modules:

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 1 — Grands comptes
  # ═══════════════════════════════════════════════════════════════════
  - id: p5-m1
    order: 1
    title: Grands comptes
    description: Comprendre ce qui change à grande échelle.
    prerequisites:
      previous_module_ids: []
      required_concept_ids: []
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 1.1 — Spécificités des grands comptes
      # ───────────────────────────────────────────────────────────────
      - id: p5-m1-l1-enterprise-specifics
        order: 1
        slug: enterprise-specifics
        title: Spécificités des grands comptes
        subtitle: Ce qui change à grande échelle
        duration_min: 8
        difficulty: 4
        xp_total: 150
        concepts: [enterprise_specifics, buying_committee]
        skills: [stratégie]
        prerequisites:
          previous_lesson_ids: []
          required_concept_ids: [meddic, closing_signals]
        unlocks:
          lesson_ids: [p5-m1-l2-formal-procurement]
        rewards:
          xp: 120
          hearts_refund: 0
        blocks:
          - type: cover
            title: Spécificités des grands comptes
            subtitle: Stratégique · Module 1 · Leçon 1
            mascot_pose: curious
            mascot_line: Un grand compte, ce n'est pas une grosse PME. C'est une autre planète.
            objectives:
              - Identifier les 5 différences majeures
              - Comprendre la notion de cycle long
              - Anticiper la complexité

          - type: theory
            slides:
              - id: t1
                title: Les 5 différences majeures
                body_md: |
                  1. **Plus de décideurs** — 5, 10, 15 personnes
                     impliquées.
                  2. **Cycle plus long** — 6, 9, 18 mois au lieu de 3-6
                     semaines.
                  3. **Process formel** — appels d'offres, comités, juri-
                     dique, achats.
                  4. **Panier plus gros** — 50 k€ à plusieurs millions.
                  5. **Impact politique interne** — le projet peut être
                     un enjeu de pouvoir.

                callout:
                  tone: info
                  title: Conséquence
                  text: La vente en grand compte est un sport d'équipe. Un seul commercial ne suffit presque jamais.
              - id: t2
                title: Le cycle de vente typique
                body_md: |
                  Un deal enterprise traverse généralement :

                  - **Étude** (1-3 mois) — le prospect découvre votre
                    solution.
                  - **Qualification approfondie** (2-4 mois) — MEDDIC,
                    POC, benchmark.
                  - **Négociation & comité** (2-6 mois) — juridique,
                    achats, direction.
                  - **Closing & signature** (1-2 mois) — admin.

                  Total : **6 à 18 mois**. Il faut anticiper.

              - id: t3
                title: Ce qui compte le plus
                body_md: |
                  En grand compte, les 3 facteurs clés sont :

                  1. **La confiance** — vous êtes un partenaire, pas un
                     fournisseur.
                  2. **La patience** — vous jouez sur 12-24 mois.
                  3. **La rigueur** — chaque détail compte (contrats,
                     engagements, références).

                  Le produit est **nécessaire mais pas suffisant**.

          - type: practice
            exercises:
              - id: p5-m1-l1-ex1
                kind: multi_select
                prompt: Quelles sont les spécificités d'un grand compte ?
                explanation_md: |
                  Plus de décideurs, cycle long, process formel, panier
                  gros, enjeux politiques internes.
                xp: 20
                difficulty: 4
                concepts: [enterprise_specifics]
                payload:
                  options:
                    - Plus de décideurs impliqués
                    - Cycle de vente plus long
                    - Process d'achat formel
                    - Panier plus gros
                    - Décisions prises uniquement par le CEO
                    - Enjeux politiques internes
                  correct: [0, 1, 2, 3, 5]

              - id: p5-m1-l1-ex2
                kind: mcq
                prompt: Quelle est la durée typique d'un cycle enterprise ?
                explanation_md: |
                  Entre 6 et 18 mois selon la complexité. Un commercial
                  grand compte joue sur le long terme.
                xp: 10
                difficulty: 3
                concepts: [long_cycle]
                payload:
                  options:
                    - 2 à 4 semaines
                    - 1 à 3 mois
                    - 6 à 18 mois
                    - 3 à 5 ans
                  correct: 2

              - id: p5-m1-l1-ex3
                kind: fill_blank
                prompt: "En grand compte, le produit est nécessaire mais pas ______."
                explanation_md: |
                  Le produit est nécessaire mais **pas suffisant** — la
                  confiance, la patience et la rigueur font la
                  différence.
                xp: 10
                difficulty: 3
                concepts: [enterprise_specifics]
                payload:
                  blanks:
                    - correct: [suffisant]

          - type: mission
            mission:
              id: mission-enterprise-profile
              title: Identifier un compte stratégique
              brief_md: |
                Dans l'app LeadCortex, choisis une entreprise de ton
                portefeuille qui ressemble à un **grand compte** (>500
                salariés) et ajoute-la à une liste nommée « Stratégique ».

                Dans les notes de la fiche, note pourquoi ce compte est
                stratégique : potentiel, complexité, enjeux.
              target:
                route: /app/companies
                cta: Voir mes entreprises
              validation:
                trigger: company.updated
                conditions:
                  - path: company.notes_length
                    op: ">="
                    value: 150
              on_success:
                xp: 60
                mascot_line: Premier compte stratégique identifié.
              on_failure:
                feedback_md: Les notes doivent contenir au moins 150 caractères.
                hint_md: Ouvre une fiche entreprise >500 salariés et documente sa valeur stratégique.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: enterprise_specifics
            front: "Citez 3 spécificités d'un grand compte vs une PME."
            back: "Plus de décideurs, cycle long (6-18 mois), process formel (appels d'offres, comités, achats), gros panier, enjeux politiques internes."
          - concept: buying_committee
            front: "Pourquoi la vente en grand compte est-elle un sport d'équipe ?"
            back: "Parce que 5 à 15 personnes sont impliquées dans la décision. Un seul commercial ne peut pas gérer tous les interlocuteurs."

      # ───────────────────────────────────────────────────────────────
      # Leçon 1.2 — Process d'achat formel
      # ───────────────────────────────────────────────────────────────
      - id: p5-m1-l2-formal-procurement
        order: 2
        slug: formal-procurement
        title: Process d'achat formel
        subtitle: Appels d'offres, comités, achats, juridique
        duration_min: 8
        difficulty: 4
        xp_total: 150
        concepts: [formal_procurement, buying_committee]
        skills: [stratégie, méthode]
        prerequisites:
          previous_lesson_ids: [p5-m1-l1-enterprise-specifics]
          required_concept_ids: [enterprise_specifics]
        unlocks:
          lesson_ids: [p5-m2-l1-long-cycle]
        rewards:
          xp: 120
          hearts_refund: 0
        blocks:
          - type: cover
            title: Process d'achat formel
            subtitle: Stratégique · Module 1 · Leçon 2
            mascot_pose: thinking
            mascot_line: Comprendre le process, c'est déjà la moitié du deal.
            objectives:
              - Comprendre les 4 étapes formelles
              - Identifier les interlocuteurs clés
              - Anticiper les points de blocage

          - type: theory
            slides:
              - id: t1
                title: Les 4 étapes formelles
                body_md: |
                  1. **Pré-qualification** — un appel d'offres est lancé
                     ou un besoin est identifié.
                  2. **Évaluation** — démos, POC, benchmark, références.
                  3. **Décision** — comité, direction, budget.
                  4. **Contractualisation** — juridique, achats, DSI,
                     sécurité.

                  Chaque étape a ses propres interlocuteurs et ses
                  propres délais.

                callout:
                  tone: warning
                  title: Piège
                  text: Un deal peut mourir à n'importe quelle étape. Un « oui » de la direction sans le juridique n'est pas un « oui ».
              - id: t2
                title: Les interlocuteurs clés
                body_md: |
                  - **Business** — le métier, le champion, le décideur
                    économique.
                  - **IT/DSI** — faisabilité technique, sécurité.
                  - **Juridique** — contrats, RGPD, conformité.
                  - **Achats** — prix, conditions, référencement.
                  - **Finance** — budget, ROI, comptabilisation.

                  Chaque interlocuteur peut **accelerer ou bloquer**.
              - id: t3
                title: Anticiper les blocages
                body_md: |
                  Poser les questions **avant** que le process ne les
                  impose :

                  - « Quelle est la procédure d'achat chez vous ? »
                  - « Qui doit valider ce type de contrat ? »
                  - « Quels sont les points sensibles côté juridique ? »

                  Anticiper = désamorcer.

          - type: practice
            exercises:
              - id: p5-m1-l2-ex1
                kind: order_steps
                prompt: Remettez les 4 étapes formelles d'un process d'achat enterprise dans l'ordre.
                explanation_md: |
                  Pré-qualification → Évaluation → Décision →
                  Contractualisation.
                xp: 20
                difficulty: 4
                concepts: [formal_procurement]
                payload:
                  steps:
                    - Pré-qualification (appel d'offres ou besoin identifié)
                    - Évaluation (démos, POC, benchmark)
                    - Décision (comité, direction, budget)
                    - Contractualisation (juridique, achats, DSI)

              - id: p5-m1-l2-ex2
                kind: multi_select
                prompt: Quels interlocuteurs peuvent influencer une décision enterprise ?
                explanation_md: |
                  Business, IT/DSI, Juridique, Achats, Finance — chaque
                  acteur a son mot à dire.
                xp: 20
                difficulty: 4
                concepts: [buying_committee]
                payload:
                  options:
                    - Business (métier, champion, décideur)
                    - IT / DSI (faisabilité technique)
                    - Juridique (contrats, conformité)
                    - Achats (prix, conditions)
                    - Finance (budget, ROI)
                    - Réceptionniste du siège
                  correct: [0, 1, 2, 3, 4]

              - id: p5-m1-l2-ex3
                kind: mcq
                prompt: |
                  Un « oui » du CEO sans validation du juridique, ça
                  vaut quoi ?
                explanation_md: |
                  **Rien**. Le juridique peut bloquer à tout moment. Un
                  vrai « oui » enterprise passe par toutes les
                  validations formelles.
                xp: 15
                difficulty: 4
                concepts: [formal_procurement]
                payload:
                  options:
                    - Un accord ferme, la signature suivra
                    - Rien, sans validation des autres parties prenantes
                    - Un signal très fort
                    - Une garantie de closing
                  correct: 1

          - type: mission
            mission:
              id: mission-map-procurement
              title: Cartographier le process d'achat d'un compte
              brief_md: |
                Dans l'app LeadCortex, ouvre un compte stratégique et
                documente dans les notes le **process d'achat** :

                (1) Les étapes connues. (2) Les interlocuteurs
                identifiés. (3) Les blocages anticipés.
              target:
                route: /app/companies
                cta: Voir mes entreprises
              validation:
                trigger: company.updated
                conditions:
                  - path: company.notes_length
                    op: ">="
                    value: 250
              on_success:
                xp: 70
                mascot_line: Process cartographié — tu sais où marcher.
              on_failure:
                feedback_md: Les notes doivent contenir au moins 250 caractères.
                hint_md: Détaille les étapes, les interlocuteurs et les blocages pressentis.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: formal_procurement
            front: "Quelles sont les 4 étapes d'un process d'achat enterprise ?"
            back: "Pré-qualification → Évaluation → Décision → Contractualisation."

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 2 — Cycles longs
  # ═══════════════════════════════════════════════════════════════════
  - id: p5-m2
    order: 2
    title: Cycles longs
    description: Piloter un deal sur 6 à 18 mois.
    prerequisites:
      previous_module_ids: [p5-m1]
      required_concept_ids: [formal_procurement]
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 2.1 — Piloter un cycle long
      # ───────────────────────────────────────────────────────────────
      - id: p5-m2-l1-long-cycle
        order: 1
        slug: long-cycle
        title: Piloter un cycle long
        subtitle: Garder le momentum sur 12 mois
        duration_min: 8
        difficulty: 4
        xp_total: 150
        concepts: [long_cycle, account_plan]
        skills: [méthode, stratégie]
        prerequisites:
          previous_lesson_ids: [p5-m1-l2-formal-procurement]
          required_concept_ids: [formal_procurement]
        unlocks:
          lesson_ids: [p5-m2-l2-buying-committee]
        rewards:
          xp: 120
          hearts_refund: 0
        blocks:
          - type: cover
            title: Piloter un cycle long
            subtitle: Stratégique · Module 2 · Leçon 1
            mascot_pose: thinking
            mascot_line: Un deal long se gagne par la discipline, pas par l'intensité.
            objectives:
              - Structurer un plan de compte
              - Maintenir le momentum
              - Détecter les signaux de refroidissement

          - type: theory
            slides:
              - id: t1
                title: Le plan de compte
                body_md: |
                  Un **plan de compte** est un document vivant qui
                  contient :

                  - **Contexte** — la situation du client.
                  - **Acteurs** — qui décide, qui influence, qui bloque.
                  - **Besoins** — les problèmes identifiés.
                  - **Notre proposition de valeur** — alignée.
                  - **Prochaines étapes datées** — 3 mois glissants.

                  Il se met à jour **chaque semaine**, pas une fois par
                  trimestre.

                callout:
                  tone: info
                  title: Règle
                  text: Un deal enterprise sans plan de compte est un deal laissé au hasard. Ça ne se gagne pas, ça s'espère.
              - id: t2
                title: Maintenir le momentum
                body_md: |
                  Sur 12 mois, un deal meurt facilement. Pour le
                  maintenir :

                  - **Touches régulières** — au moins une interaction
                    toutes les 3 semaines.
                  - **Valeur à chaque touche** — jamais de « je relance
                    pour relancer ».
                  - **Prochaines étapes datées** — chaque call finit avec
                    une date.
                  - **Engagement croissant** — le prospect investit de
                    plus en plus (temps, données, réunions internes).
              - id: t3
                title: Les signaux de refroidissement
                body_md: |
                  - Plus de réponse à vos emails.
                  - Annulation répétée de réunions.
                  - Le champion devient silencieux.
                  - Le budget est reporté à l'année suivante.
                  - Un nouveau décideur apparaît et « veut tout revoir ».

                  Ces signaux doivent **déclencher une action
                  immédiate** — pas attendre.

          - type: practice
            exercises:
              - id: p5-m2-l1-ex1
                kind: multi_select
                prompt: Que contient un plan de compte ?
                explanation_md: |
                  Contexte, acteurs, besoins, valeur, prochaines étapes
                  datées. C'est un document vivant mis à jour chaque
                  semaine.
                xp: 20
                difficulty: 4
                concepts: [account_plan]
                payload:
                  options:
                    - Contexte du client
                    - Cartographie des acteurs
                    - Besoins identifiés
                    - Proposition de valeur alignée
                    - Prochaines étapes datées
                    - Historique de vos autres clients
                  correct: [0, 1, 2, 3, 4]

              - id: p5-m2-l1-ex2
                kind: mcq
                prompt: À quelle fréquence toucher un prospect en cycle long ?
                explanation_md: |
                  Au moins une interaction toutes les 3 semaines, avec
                  de la valeur à chaque fois — jamais de relance vide.
                xp: 10
                difficulty: 4
                concepts: [long_cycle]
                payload:
                  options:
                    - Tous les jours
                    - Toutes les semaines
                    - Toutes les 3 semaines au minimum
                    - Une fois par trimestre suffit
                  correct: 2

              - id: p5-m2-l1-ex3
                kind: multi_select
                prompt: Quels signaux indiquent qu'un deal se refroidit ?
                explanation_md: |
                  Silence, annulations, champion absent, budget reporté,
                  nouveau décideur qui veut tout revoir.
                xp: 15
                difficulty: 4
                concepts: [long_cycle]
                payload:
                  options:
                    - Plus de réponse aux emails
                    - Annulation répétée de réunions
                    - Champion silencieux
                    - Budget reporté à l'année suivante
                    - Client demande une démo supplémentaire
                  correct: [0, 1, 2, 3]

          - type: mission
            mission:
              id: mission-account-plan
              title: Rédiger un plan de compte
              brief_md: |
                Dans l'app LeadCortex, ouvre un compte stratégique et
                rédige dans les notes un **plan de compte** structuré :

                Contexte / Acteurs / Besoins / Valeur / Prochaines étapes
                datées.
              target:
                route: /app/companies
                cta: Voir mes entreprises
              validation:
                trigger: company.updated
                conditions:
                  - path: company.notes_length
                    op: ">="
                    value: 400
              on_success:
                xp: 90
                mascot_line: Plan de compte rédigé — tu pilotes sur la durée.
              on_failure:
                feedback_md: Les notes doivent contenir au moins 400 caractères.
                hint_md: Structure ton plan en 5 sections. Détaille chaque partie.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: long_cycle
            front: "Comment maintenir le momentum sur un cycle de 12 mois ?"
            back: "Toucher toutes les 3 semaines min, apporter de la valeur à chaque touche, finir chaque call par une prochaine étape datée, faire croître l'engagement."
          - concept: account_plan
            front: "Que contient un plan de compte ?"
            back: "Contexte, cartographie des acteurs, besoins, proposition de valeur, prochaines étapes datées. Mis à jour chaque semaine."

      # ───────────────────────────────────────────────────────────────
      # Leçon 2.2 — Comité d'achat
      # ───────────────────────────────────────────────────────────────
      - id: p5-m2-l2-buying-committee
        order: 2
        slug: buying-committee
        title: Comité d'achat
        subtitle: Cartographier tous les acteurs
        duration_min: 8
        difficulty: 4
        xp_total: 150
        concepts: [buying_committee, multi_threading]
        skills: [stratégie]
        prerequisites:
          previous_lesson_ids: [p5-m2-l1-long-cycle]
          required_concept_ids: [long_cycle]
        unlocks:
          lesson_ids: [p5-m3-l1-mapping]
        rewards:
          xp: 120
          hearts_refund: 0
        blocks:
          - type: cover
            title: Comité d'achat
            subtitle: Stratégique · Module 2 · Leçon 2
            mascot_pose: thinking
            mascot_line: Un deal enterprise se gagne avec 6 personnes, pas contre elles.
            objectives:
              - Cartographier un comité d'achat
              - Distinguer les rôles
              - Prioriser les relations

          - type: theory
            slides:
              - id: t1
                title: Les 6 rôles classiques
                body_md: |
                  Dans un comité d'achat enterprise :

                  1. **Initiateur** — identifie le problème.
                  2. **Utilisateur** — utilise la solution.
                  3. **Influenceur** — recommande des options.
                  4. **Décideur** — choisit la solution.
                  5. **Approbateur** — valide le budget (au-dessus du
                     décideur).
                  6. **Acheteur** — gère le contrat et les conditions.

                  Une même personne peut cumuler plusieurs rôles.
                callout:
                  tone: info
                  title: Conséquence
                  text: Si vous ne savez pas qui joue chaque rôle, vous ne pouvez pas jouer au jeu.
              - id: t2
                title: Cartographier le comité
                body_md: |
                  Pour chaque acteur, notez :

                  - **Rôle** dans le comité.
                  - **Enjeu personnel** — qu'est-ce qu'il gagne ou perd ?
                  - **Position** — pour, contre, neutre.
                  - **Influence** — faible, moyenne, forte.

                  Cette cartographie est **la** clé du multi-threading
                  (voir module suivant).

              - id: t3
                title: Les erreurs classiques
                body_md: |
                  - **Ne parler qu'à un seul acteur** (le champion).
                  - **Ignorer les silencieux** (ils bloquent au pire
                    moment).
                  - **Confondre influence et titre** — un lead peut
                    influencer plus qu'un VP.
                  - **Sous-estimer les achats** — c'est là que les deals
                    meurent en silence.

          - type: practice
            exercises:
              - id: p5-m2-l2-ex1
                kind: match_pairs
                prompt: Associez chaque rôle du comité d'achat à sa fonction.
                explanation_md: |
                  Initiateur, Utilisateur, Influenceur, Décideur,
                  Approbateur, Acheteur — 6 rôles à cartographier.
                xp: 20
                difficulty: 4
                concepts: [buying_committee]
                payload:
                  pairs:
                    - left: Initiateur
                      right: Identifie le problème
                    - left: Utilisateur
                      right: Utilise la solution
                    - left: Influenceur
                      right: Recommande des options
                    - left: Décideur
                      right: Choisit la solution
                    - left: Approbateur
                      right: Valide le budget
                    - left: Acheteur
                      right: Gère le contrat et les conditions

              - id: p5-m2-l2-ex2
                kind: multi_select
                prompt: Que noter pour chaque acteur du comité ?
                explanation_md: |
                  Rôle, enjeu personnel, position (pour/contre/neutre),
                  influence (faible/moyenne/forte).
                xp: 15
                difficulty: 4
                concepts: [buying_committee]
                payload:
                  options:
                    - Son rôle dans le comité
                    - Son enjeu personnel
                    - Sa position (pour / contre / neutre)
                    - Son influence
                    - Sa couleur préférée
                  correct: [0, 1, 2, 3]

              - id: p5-m2-l2-ex3
                kind: mcq
                prompt: |
                  Pourquoi ignorer les silencieux du comité peut tuer
                  le deal ?
                explanation_md: |
                  Un silencieux peut devenir **bloqueur au dernier
                  moment** — souvent côté achats ou juridique. Il faut
                  l'identifier tôt.
                xp: 15
                difficulty: 4
                concepts: [buying_committee, blockers]
                payload:
                  options:
                    - Ils sont toujours contre par défaut
                    - Ils peuvent bloquer au dernier moment
                    - Ils n'ont aucun impact
                    - Ils augmentent le prix
                  correct: 1

          - type: mission
            mission:
              id: mission-buying-committee-map
              title: Cartographier un comité d'achat
              brief_md: |
                Dans l'app LeadCortex, ouvre un compte stratégique et
                documente dans les notes une **cartographie du comité
                d'achat**.

                Pour chaque acteur : nom, rôle, enjeu, position,
                influence.
              target:
                route: /app/companies
                cta: Voir mes entreprises
              validation:
                trigger: company.updated
                conditions:
                  - path: company.notes_length
                    op: ">="
                    value: 350
              on_success:
                xp: 90
                mascot_line: Comité cartographié — tu sais qui joue quoi.
              on_failure:
                feedback_md: Les notes doivent contenir au moins 350 caractères.
                hint_md: Liste au moins 4 acteurs avec rôle, enjeu, position et influence.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: buying_committee
            front: "Citez les 6 rôles classiques d'un comité d'achat enterprise."
            back: "Initiateur, Utilisateur, Influenceur, Décideur, Approbateur, Acheteur."
          - concept: multi_threading
            front: "Pourquoi faut-il éviter de ne parler qu'à un seul acteur d'un comité ?"
            back: "Le champion peut partir ou être bloqué. Un seul acteur = point unique de défaillance. Il faut tisser plusieurs relations."

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 3 — Multi-threading
  # ═══════════════════════════════════════════════════════════════════
  - id: p5-m3
    order: 3
    title: Multi-threading
    description: Tisser plusieurs relations en parallèle.
    prerequisites:
      previous_module_ids: [p5-m2]
      required_concept_ids: [buying_committee]
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 3.1 — Cartographier les décideurs
      # ───────────────────────────────────────────────────────────────
      - id: p5-m3-l1-mapping
        order: 1
        slug: mapping
        title: Cartographier les décideurs
        subtitle: Identifier les alliés, les neutres, les bloqueurs
        duration_min: 8
        difficulty: 5
        xp_total: 160
        concepts: [multi_threading, blockers, champion_enterprise]
        skills: [stratégie, analyse]
        prerequisites:
          previous_lesson_ids: [p5-m2-l2-buying-committee]
          required_concept_ids: [buying_committee]
        unlocks:
          lesson_ids: [p5-m3-l2-enterprise-champion]
        rewards:
          xp: 130
          hearts_refund: 0
        blocks:
          - type: cover
            title: Cartographier les décideurs
            subtitle: Stratégique · Module 3 · Leçon 1
            mascot_pose: thinking
            mascot_line: Tu ne peux pas jouer contre une carte que tu ne vois pas.
            objectives:
              - Classer les acteurs en 3 catégories
              - Prioriser les relations à créer
              - Anticiper les blocages

          - type: theory
            slides:
              - id: t1
                title: 3 catégories d'acteurs
                body_md: |
                  Pour chaque acteur du comité :

                  - **Alliés** — favorables au projet. À cultiver et
                    utiliser comme relais internes.
                  - **Neutres** — sans opinion. À convaincre avec des
                    arguments ciblés.
                  - **Bloqueurs** — opposés (peur, concurrence, politique
                    interne). À neutraliser ou contourner.

                callout:
                  tone: warning
                  title: Attention
                  text: Un neutre non travaillé peut basculer en bloqueur. Un bloqueur non identifié peut tuer le deal au dernier moment.
              - id: t2
                title: La matrice pouvoir / intérêt
                body_md: |
                  |  | Faible intérêt | Fort intérêt |
                  |---|---|---|
                  | **Fort pouvoir** | À tenir informé | À satisfaire activement |
                  | **Faible pouvoir** | À surveiller | À tenir informé |

                  Les acteurs **fort pouvoir + fort intérêt** sont
                  prioritaires. Les **fort pouvoir + faible intérêt**
                  peuvent bloquer s'ils sont oubliés — à tenir informés.
              - id: t3
                title: Prioriser les relations
                body_md: |
                  On priorise par :

                  1. **Pouvoir de décision** — qui peut dire oui ? non ?
                  2. **Position actuelle** — bloqueur > neutre > allié.
                  3. **Facilité d'accès** — par qui passer pour approcher.

                  Ordre d'attaque : **convaincre les neutres importants,
                  neutraliser les bloqueurs, entretenir les alliés**.

          - type: practice
            exercises:
              - id: p5-m3-l1-ex1
                kind: multi_select
                prompt: Quelles catégories pour classer les acteurs ?
                explanation_md: |
                  Alliés, neutres, bloqueurs. Chaque catégorie appelle
                  une stratégie différente.
                xp: 15
                difficulty: 4
                concepts: [multi_threading, blockers]
                payload:
                  options:
                    - Alliés
                    - Neutres
                    - Bloqueurs
                    - Concurrents
                    - Clients
                  correct: [0, 1, 2]

              - id: p5-m3-l1-ex2
                kind: mcq
                prompt: |
                  Que faire d'un acteur « fort pouvoir + faible
                  intérêt » ?
                explanation_md: |
                  On le **tient informé**. S'il est oublié, il peut
                  bloquer au dernier moment. Il n'a pas besoin d'être
                  activement impliqué, juste pas ignoré.
                xp: 15
                difficulty: 5
                concepts: [multi_threading]
                payload:
                  options:
                    - L'ignorer complètement
                    - L'impliquer intensivement
                    - Le tenir informé régulièrement
                    - Le neutraliser immédiatement
                  correct: 2

              - id: p5-m3-l1-ex3
                kind: order_steps
                prompt: |
                  Remettez dans l'ordre les priorités d'attaque d'un
                  comité d'achat.
                explanation_md: |
                  On convainc les neutres importants, on neutralise les
                  bloqueurs, on entretient les alliés.
                xp: 20
                difficulty: 5
                concepts: [multi_threading, blockers]
                payload:
                  steps:
                    - Convaincre les neutres importants
                    - Neutraliser les bloqueurs
                    - Entretenir les alliés

          - type: mission
            mission:
              id: mission-map-stakeholders
              title: Classer les acteurs d'un compte
              brief_md: |
                Dans l'app LeadCortex, ouvre un compte stratégique et
                ajoute dans les notes une **classification des acteurs
                en 3 catégories** : alliés, neutres, bloqueurs.

                Pour chaque catégorie, liste 1 à 3 noms avec une
                justification courte.
              target:
                route: /app/companies
                cta: Voir mes entreprises
              validation:
                trigger: company.updated
                conditions:
                  - path: company.notes_length
                    op: ">="
                    value: 300
              on_success:
                xp: 90
                mascot_line: Cartographie faite — tu sais où concentrer tes efforts.
              on_failure:
                feedback_md: Les notes doivent contenir au moins 300 caractères.
                hint_md: Structure en 3 sections (alliés / neutres / bloqueurs).
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: multi_threading
            front: "Quelles sont les 3 catégories d'acteurs dans un comité d'achat ?"
            back: "Alliés (favorables), neutres (sans opinion), bloqueurs (opposés). Priorité : convaincre les neutres, neutraliser les bloqueurs, entretenir les alliés."
          - concept: blockers
            front: "Que faire d'un acteur 'fort pouvoir + faible intérêt' ?"
            back: "Le tenir informé régulièrement. S'il est oublié, il peut bloquer au dernier moment."

      # ───────────────────────────────────────────────────────────────
      # Leçon 3.2 — Champion en grand compte
      # ───────────────────────────────────────────────────────────────
      - id: p5-m3-l2-enterprise-champion
        order: 2
        slug: enterprise-champion
        title: Champion en grand compte
        subtitle: Le rôle le plus critique et le plus fragile
        duration_min: 8
        difficulty: 5
        xp_total: 160
        concepts: [champion_enterprise, blockers, multi_threading]
        skills: [stratégie, communication]
        prerequisites:
          previous_lesson_ids: [p5-m3-l1-mapping]
          required_concept_ids: [multi_threading]
        unlocks:
          lesson_ids: [p5-m4-l1-qbr]
        rewards:
          xp: 130
          hearts_refund: 0
        blocks:
          - type: cover
            title: Champion en grand compte
            subtitle: Stratégique · Module 3 · Leçon 2
            mascot_pose: happy
            mascot_line: Ton champion est ton meilleur allié — et ton talon d'Achille.
            objectives:
              - Reconnaître un vrai champion
              - Protéger le champion
              - Savoir quoi faire s'il part

          - type: theory
            slides:
              - id: t1
                title: Reconnaître un vrai champion
                body_md: |
                  Un vrai champion en grand compte **fait** :

                  - Il **partage** des informations internes sensibles.
                  - Il **construit** le business case avec vous.
                  - Il **vend** votre solution en interne quand vous
                    n'êtes pas là.
                  - Il **ouvre** des portes vers d'autres décideurs.
                  - Il **défend** votre projet contre les objections
                    internes.

                  Un contact enthousiaste qui ne fait rien de tout ça
                  n'est **pas un champion**.
                callout:
                  tone: warning
                  title: Piège
                  text: Beaucoup de commerciaux croient avoir un champion alors qu'ils ont juste un contact sympa. Un vrai champion se voit à ses actions internes, pas à ses sourires en réunion.
              - id: t2
                title: Protéger le champion
                body_md: |
                  Un champion est **fragile** :

                  - Il risque sa crédibilité interne sur votre projet.
                  - Il peut subir des pressions de sa hiérarchie.
                  - Il peut être muté, promu ou partir.

                  Pour le protéger :

                  - Donnez-lui des **munitions** (données, cas, chiffres).
                  - Ne le mettez **jamais** en difficulté devant ses
                    pairs.
                  - Célébrez **ses** victoires publiquement.
                  - Diversifiez — un champion seul, c'est un point
                    unique de défaillance.
              - id: t3
                title: Si le champion part
                body_md: |
                  Le champion part. Le deal est-il mort ?

                  Pas forcément. Trois actions :

                  1. **Sécuriser les acquis** — où en est le dossier ?
                  2. **Identifier un relais** — un autre acteur favorable
                     peut prendre la suite.
                  3. **Contacter le nouveau champion** — présenter la
                     valeur, recommencer la relation.

                  Le multi-threading précoce réduit l'impact du départ.

          - type: practice
            exercises:
              - id: p5-m3-l2-ex1
                kind: multi_select
                prompt: Qu'est-ce qu'un vrai champion en grand compte ?
                explanation_md: |
                  Il partage des infos, construit le business case,
                  vend en interne, ouvre des portes, défend le projet.
                xp: 20
                difficulty: 5
                concepts: [champion_enterprise]
                payload:
                  options:
                    - Partage des informations internes sensibles
                    - Construit le business case avec vous
                    - Vend la solution en interne
                    - Ouvre des portes vers d'autres décideurs
                    - Se contente d'être enthousiaste en réunion
                  correct: [0, 1, 2, 3]

              - id: p5-m3-l2-ex2
                kind: mcq
                prompt: |
                  Que faut-il faire si le champion quitte
                  l'entreprise ?
                explanation_md: |
                  Sécuriser les acquis, identifier un relais, contacter
                  le nouveau champion. Le multi-threading précoce réduit
                  l'impact.
                xp: 15
                difficulty: 5
                concepts: [champion_enterprise, multi_threading]
                payload:
                  options:
                    - Abandonner le deal
                    - Sécuriser les acquis et identifier un relais
                    - Contacter directement le CEO
                    - Attendre qu'un nouveau champion émerge
                  correct: 1

              - id: p5-m3-l2-ex3
                kind: fill_blank
                prompt: "Un champion seul dans un comité est un ______ unique de défaillance."
                explanation_md: |
                  Un champion seul = **point** unique de défaillance.
                  Le multi-threading diversifie le risque.
                xp: 10
                difficulty: 4
                concepts: [champion_enterprise, multi_threading]
                payload:
                  blanks:
                    - correct: [point, "point de", "point unique"]

          - type: mission
            mission:
              id: mission-identify-champion
              title: Identifier et protéger un champion
              brief_md: |
                Dans l'app LeadCortex, ouvre un compte stratégique et
                documente :

                (1) Qui est ton champion. (2) Ce qu'il fait concrètement
                pour le projet. (3) Comment tu le protèges. (4) Qui
                pourrait être son relais si jamais.
              target:
                route: /app/companies
                cta: Voir mes entreprises
              validation:
                trigger: company.updated
                conditions:
                  - path: company.notes_length
                    op: ">="
                    value: 300
              on_success:
                xp: 90
                mascot_line: Champion identifié et protégé.
              on_failure:
                feedback_md: Les notes doivent contenir au moins 300 caractères.
                hint_md: Réponds aux 4 questions posées dans le brief.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: champion_enterprise
            front: "Qu'est-ce qu'un vrai champion en grand compte ?"
            back: "Il partage des infos internes, construit le business case, vend en interne, ouvre des portes, défend le projet. Pas juste un contact sympa."
          - concept: multi_threading
            front: "Pourquoi protéger son champion en grand compte ?"
            back: "Il risque sa crédibilité, subit des pressions, peut partir. Un champion seul = point unique de défaillance."

  # ═══════════════════════════════════════════════════════════════════
  # MODULE 4 — Account management
  # ═══════════════════════════════════════════════════════════════════
  - id: p5-m4
    order: 4
    title: Account management
    description: Piloter un compte stratégique dans la durée.
    prerequisites:
      previous_module_ids: [p5-m3]
      required_concept_ids: [champion_enterprise]
    lessons:

      # ───────────────────────────────────────────────────────────────
      # Leçon 4.1 — QBR
      # ───────────────────────────────────────────────────────────────
      - id: p5-m4-l1-qbr
        order: 1
        slug: qbr
        title: QBR
        subtitle: Quarterly Business Review
        duration_min: 8
        difficulty: 4
        xp_total: 150
        concepts: [qbr, account_plan]
        skills: [méthode, communication]
        prerequisites:
          previous_lesson_ids: [p5-m3-l2-enterprise-champion]
          required_concept_ids: [champion_enterprise]
        unlocks:
          lesson_ids: [p5-m4-l2-exec-sponsor]
        rewards:
          xp: 120
          hearts_refund: 0
        blocks:
          - type: cover
            title: QBR
            subtitle: Stratégique · Module 4 · Leçon 1
            mascot_pose: happy
            mascot_line: Un bon QBR n'est pas un rapport. C'est une conversation stratégique.
            objectives:
              - Comprendre le rôle d'un QBR
              - Structurer un QBR efficace
              - Éviter le QBR « catalogue »

          - type: theory
            slides:
              - id: t1
                title: Le QBR, c'est quoi ?
                body_md: |
                  Un **QBR** (Quarterly Business Review) est une réunion
                  **trimestrielle** avec le client qui a 3 objectifs :

                  1. **Bilan** — qu'est-ce qu'on a accompli ?
                  2. **Diagnostic** — où sont les freins ?
                  3. **Plan** — qu'est-ce qu'on fait au trimestre
                     suivant ?

                  Ce n'est **pas** une présentation commerciale. C'est un
                  exercice conjoint.

                callout:
                  tone: info
                  title: Différence
                  text: Un QBR réussi se termine avec un plan partagé, pas avec une démo produit.
              - id: t2
                title: Structurer un QBR
                body_md: |
                  Le QBR idéal tient en **60 minutes** :

                  - **5 min** — Objectifs du trimestre.
                  - **15 min** — Résultats obtenus (données).
                  - **15 min** — Freins rencontrés (franc-parler).
                  - **15 min** — Plan du trimestre suivant.
                  - **10 min** — Décisions et prochaines étapes.

                  Chaque section a un **livrable explicite**.
              - id: t3
                title: Le QBR qui rate
                body_md: |
                  Un QBR qui rate ressemble à :

                  - Une **présentation commerciale** déguisée.
                  - Un **catalogue de fonctionnalités** non utilisées.
                  - Des **chiffres embellis** qui ne reflètent pas la
                    réalité.
                  - Une **absence du champion** dans la salle.
                  - Aucune **prochaine étape** à la fin.

                  Le QBR doit **servir le client**, pas votre pipeline.

          - type: practice
            exercises:
              - id: p5-m4-l1-ex1
                kind: multi_select
                prompt: Quels sont les 3 objectifs d'un QBR ?
                explanation_md: |
                  Bilan, diagnostic, plan du trimestre suivant. C'est un
                  exercice conjoint, pas une présentation.
                xp: 15
                difficulty: 4
                concepts: [qbr]
                payload:
                  options:
                    - Bilan des résultats du trimestre
                    - Diagnostic des freins
                    - Plan du trimestre suivant
                    - Démonstration de nouvelles fonctionnalités
                    - Négociation commerciale
                  correct: [0, 1, 2]

              - id: p5-m4-l1-ex2
                kind: mcq
                prompt: Quelle est la durée idéale d'un QBR ?
                explanation_md: |
                  Environ **60 minutes**. Au-delà, l'attention décroche.
                  En-deçà, on ne couvre pas les 3 objectifs.
                xp: 10
                difficulty: 3
                concepts: [qbr]
                payload:
                  options:
                    - 15 minutes
                    - 30 minutes
                    - 60 minutes
                    - 3 heures
                  correct: 2

              - id: p5-m4-l1-ex3
                kind: multi_select
                prompt: Qu'est-ce qui fait rater un QBR ?
                explanation_md: |
                  Une présentation commerciale déguisée, un catalogue de
                  fonctionnalités, des chiffres embellis, l'absence du
                  champion, aucune prochaine étape.
                xp: 15
                difficulty: 4
                concepts: [qbr]
                payload:
                  options:
                    - Présentation commerciale déguisée
                    - Catalogue de fonctionnalités non utilisées
                    - Chiffres embellis
                    - Absence du champion
                    - Aucune prochaine étape
                    - Utilisation d'un support visuel
                  correct: [0, 1, 2, 3, 4]

          - type: mission
            mission:
              id: mission-prepare-qbr
              title: Préparer un QBR
              brief_md: |
                Dans l'app LeadCortex, planifie un **meeting** de type
                QBR et prépare dans les notes :

                (1) Les résultats du trimestre. (2) Les freins observés.
                (3) Le plan du trimestre suivant. (4) Les décisions
                attendues.
              target:
                route: /app/meetings
                cta: Planifier un QBR
              validation:
                trigger: meeting.scheduled
                conditions:
                  - path: meeting.notes_length
                    op: ">="
                    value: 300
              on_success:
                xp: 80
                mascot_line: QBR préparé — tu pilotes la relation stratégique.
              on_failure:
                feedback_md: Les notes doivent contenir au moins 300 caractères.
                hint_md: Structure ton QBR en 4 sections comme dans le brief.
              hint_after_minutes: 5
              retry_allowed: true

          - type: debrief
            sections: [score_breakdown, concepts_mastered, next_recommendation]

        srs_templates:
          - concept: qbr
            front: "Quels sont les 3 objectifs d'un QBR ?"
            back: "Bilan (résultats du trimestre), Diagnostic (freins), Plan (trimestre suivant). 60 min, exercice conjoint avec le client."

      # ───────────────────────────────────────────────────────────────
      # Leçon 4.2 — Exec sponsor
      # ───────────────────────────────────────────────────────────────
      - id: p5-m4-l2-exec-sponsor
        order: 2
        slug: exec-sponsor
        title: Exec sponsor
        subtitle: Sponsor exécutif et gestion de compte long terme
        duration_min: 8
        difficulty: 5
        xp_total: 170
        concepts: [exec_sponsor, account_plan, qbr]
        skills: [stratégie, communication]
        prerequisites:
          previous_lesson_ids: [p5-m4-l1-qbr]
          required_concept_ids: [qbr]
        unlocks:
          lesson_ids: []
        rewards:
          xp: 140
          hearts_refund: 0
        blocks:
          - type: cover
            title: Exec sponsor
            subtitle: Stratégique · Module 4 · Leçon 2
            mascot_pose: happy
            mascot_line: Sur les grands comptes, le sponsor exécutif est ta meilleure assurance.
            objectives:
              - Comprendre le rôle d'un exec sponsor
              - Recruter un exec sponsor côté client et côté vendeur
              - Piloter la relation au plus haut niveau

          - type: theory
            slides:
              - id: t1
                title: Deux exec sponsors
                body_md: |
                  Sur un compte stratégique, il y a deux exec sponsors :

                  - **Côté client** — un membre du comité exécutif qui
                    porte le projet au plus haut niveau.
                  - **Côté vendeur** — un exec de votre entreprise qui
                    s'engage personnellement sur le compte.

                  Les deux jouent un rôle **différent** mais
                  **complémentaire**.

                callout:
                  tone: info
                  title: Règle
                  text: Sans exec sponsor côté client, un deal enterprise reste dans les mains du middle management — donc fragile. Sans exec sponsor côté vendeur, le client ne sent pas l'engagement stratégique de votre entreprise.
              - id: t2
                title: Recruter un exec sponsor client
                body_md: |
                  On n'a pas d'exec sponsor client par hasard. On le
                  construit :

                  - **Cibler** la bonne personne (VP, CEO-1, DG).
                  - **Lui donner** une raison de s'engager (ROI, vision
                    stratégique).
                  - **Le rencontrer** en face à face, hors process
                    d'achat.
                  - **Lui proposer** un rôle visible (présidence d'un
                    comité, lancement public).

                  Un exec sponsor s'engage parce qu'il **y trouve un
                  intérêt stratégique**.
              - id: t3
                title: Faire jouer son exec sponsor vendeur
                body_md: |
                  Votre exec sponsor vendeur peut :

                  - **Rencontrer** l'exec sponsor client en face à face.
                  - **Participer** à un QBR de haut niveau.
                  - **Appeler** personnellement en cas de blocage.
                  - **S'engager** sur des engagements stratégiques
                    (roadmap, partenariat).

                  Un exec sponsor vendeur qui ne fait rien de tout ça
                  n'est pas un exec sponsor — c'est un titre.

          - type: practice
            exercises:
              - id: p5-m4-l2-ex1
                kind: multi_select
                prompt: Quels sont les rôles d'un exec sponsor côté vendeur ?
                explanation_md: |
                  Rencontrer l'exec sponsor client, participer aux QBR
                  de haut niveau, appeler en cas de blocage, s'engager
                  sur des engagements stratégiques.
                xp: 20
                difficulty: 5
                concepts: [exec_sponsor]
                payload:
                  options:
                    - Rencontrer l'exec sponsor côté client
                    - Participer à un QBR de haut niveau
                    - Appeler personnellement en cas de blocage
                    - S'engager sur des engagements stratégiques
                    - Gérer les tickets support
                  correct: [0, 1, 2, 3]

              - id: p5-m4-l2-ex2
                kind: mcq
                prompt: |
                  Pourquoi un exec sponsor côté client est-il critique ?
                explanation_md: |
                  Sans exec sponsor client, le deal reste dans les mains
                  du middle management — donc **fragile**. Un exec
                  sponsor porte le projet au plus haut niveau et le
                  protège des aléas.
                xp: 15
                difficulty: 5
                concepts: [exec_sponsor]
                payload:
                  options:
                    - Parce que c'est obligatoire dans les grands comptes
