# Catalogue standard des badges de l'academy.
# Les IDs référencés ici sont utilisés par :
#   - content/programs/*.yaml (unlock_badge_ids)
#   - internal/gamification/xp.go (levelRewards)
#   - internal/gamification/streak.go (StreakMilestones)

# ─── PROGRESSION (leçons, programmes) ─────────────────────────────────

- id: first-steps
  name: Premiers pas
  description: Tu as terminé ta première leçon.
  icon: footsteps
  color: "#3186FF"
  category: progress
  rarity: common
  conditions:
    - path: learner.lessons_completed
      op: ">="
      value: 1

- id: first-program
  name: Premier programme
  description: Tu as terminé un programme entier.
  icon: medal
  color: "#3186FF"
  category: progress
  rarity: rare
  conditions:
    - path: learner.programs_completed
      op: ">="
      value: 1

- id: marathon-runner
  name: Marathonien
  description: 10 leçons terminées.
  icon: flag
  color: "#3186FF"
  category: progress
  rarity: rare
  conditions:
    - path: learner.lessons_completed
      op: ">="
      value: 10

